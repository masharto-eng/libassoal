<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bank Soal & Ujian</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F1EEE3;
    --paper-line:#DCD5C0;
    --panel:#FFFFFF;
    --ink:#23283A;
    --ink-soft:#5B6076;
    --red:#9C2B20;
    --red-soft:#C8776C;
    --olive:#5B6B4F;
    --olive-soft:#E4E9DC;
    --border:#CFC7AC;
    --border-soft:#E4DFCE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Lora',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:14px;}

  .app{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* header */
  .masthead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px;}
  .masthead h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  .masthead .tagline{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .role-switch{display:flex;gap:6px;}
  .role-switch button{background:none;border:1px solid var(--border);padding:6px 12px;border-radius:3px;font-size:12.5px;color:var(--ink-soft);}
  .role-switch button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* tabs */
  .tabs{display:flex;gap:2px;margin-bottom:20px;}
  .tab{padding:9px 16px;font-size:13.5px;border:1px solid var(--border);border-bottom:none;background:#E9E4D4;color:var(--ink-soft);border-radius:6px 6px 0 0;position:relative;top:1px;}
  .tab.active{background:var(--panel);color:var(--ink);font-weight:600;border-bottom:1px solid var(--panel);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:0 6px 6px 6px;padding:22px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:4px;background:#FDFCF8;color:var(--ink);
  }
  .field textarea{min-height:64px;resize:vertical;}
  .row{display:flex;gap:14px;}
  .row>.field{flex:1;}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:13.5px;font-weight:600;}
  .btn.secondary{background:none;color:var(--ink);border-color:var(--border);font-weight:500;}
  .btn.danger{background:none;color:var(--red);border-color:var(--red-soft);font-weight:500;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .opt-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .opt-row .tag{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--ink-soft);flex-shrink:0;}
  .opt-row input[type=text]{flex:1;}

  .qcard{border:1px solid var(--border-soft);border-radius:5px;padding:14px 16px;margin-bottom:10px;background:#FDFCF8;}
  .qcard .qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .qcard .qtype{font-size:11px;text-transform:none;color:var(--olive);background:var(--olive-soft);padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:6px;}
  .qcard .qtext{font-size:14.5px;line-height:1.5;}
  .qcard .qactions{display:flex;gap:6px;flex-shrink:0;}
  .qcard .qactions button{background:none;border:none;color:var(--ink-soft);font-size:12.5px;padding:3px 6px;}
  .qcard .qactions button:hover{color:var(--ink);}
  .qcard .qmeta{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .qcard ul.opts{margin:8px 0 0;padding-left:0;list-style:none;font-size:13.5px;color:var(--ink-soft);}
  .qcard ul.opts li{padding:3px 6px 3px 10px;margin-bottom:2px;border-left:4px solid transparent;border-radius:2px;}
  .qcard ul.opts li.correct{color:var(--olive);font-weight:600;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .serif{font-size:17px;color:var(--ink);margin-bottom:6px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .toolbar .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:5px 11px;font-size:12.5px;border:1px solid var(--border);border-radius:14px;background:none;color:var(--ink-soft);}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;}

  /* print sheet */
  .sheet{background:var(--panel);border:1px solid var(--border);box-shadow:0 2px 10px rgba(35,40,58,0.06);padding:40px 46px;max-width:760px;margin:0 auto;}
  .sheet-head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px;}
  .sheet-head h2{margin:0 0 4px;font-size:19px;}
  .sheet-head .meta{font-size:12.5px;color:var(--ink-soft);}
  .sheet .instructions{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;font-style:italic;}
  .sheet-q{margin-bottom:16px;font-size:13.5px;line-height:1.6;}
  .sheet-q .qn{font-weight:700;}
  .sheet-q .opts{margin:5px 0 0 20px;}
  .sheet-q .opts div{margin-bottom:2px;}
  .answer-key{margin-top:30px;border-top:1px dashed var(--border);padding-top:18px;}
  .answer-key h3{font-size:14px;margin:0 0 8px;}
  .answer-key .akrow{font-size:12.5px;margin-bottom:3px;}

  /* exam taking */
  .code-hero{max-width:420px;margin:60px auto;text-align:center;}
  .code-hero h2{font-size:22px;margin-bottom:6px;}
  .code-hero p{color:var(--ink-soft);font-size:13.5px;margin-bottom:24px;}
  .code-hero input{text-align:center;font-size:18px;letter-spacing:0.12em;}
  .quiz-q{border:1px solid var(--border-soft);border-radius:5px;padding:18px 20px;margin-bottom:14px;background:#FDFCF8;}
  .quiz-q .qn{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .quiz-q .qtext{font-size:15px;margin-bottom:12px;}
  .choice{display:flex;align-items:center;gap:11px;padding:8px 10px;border:2px solid transparent;border-radius:4px;margin-bottom:6px;}
  .choice.picked{box-shadow:0 0 0 1px rgba(35,40,58,0.08);}
  .opt-badge{flex-shrink:0;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
  .opt-check{margin-left:auto;font-weight:700;font-size:15px;flex-shrink:0;}
  .choice input{margin-top:3px;}
  .match-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px;}
  .match-row .l{flex:1;}
  .match-row select{flex:1;}

  /* drag-line matching */
  .match-hint{margin-bottom:10px;}
  .match-wrap{position:relative;user-select:none;}
  .match-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .match-line{stroke-width:2.5;stroke-linecap:round;}
  .match-line.temp{stroke-dasharray:5 4;}
  .match-cols{display:flex;justify-content:space-between;gap:36px;position:relative;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
  .match-item{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;border:2px solid var(--border-soft);border-radius:4px;background:var(--panel);font-size:13.5px;transition:border-color .15s;}
  .match-item.connected{box-shadow:0 0 0 1px rgba(35,40,58,0.06);}
  .match-item.connected .dot{opacity:1;}
  .match-col.right .match-item{justify-content:flex-start;}
  .match-text{flex:1;}
  .match-clear{border:none;background:none;color:var(--red);font-size:12px;padding:0 2px;line-height:1;flex-shrink:0;}
  .dot{position:absolute;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--ink);cursor:grab;touch-action:none;z-index:2;}
  .dot:active{cursor:grabbing;}
  .match-col.left .dot-right{right:-8px;}
  .match-col.right .dot-left{left:-8px;}

  .code-badge{display:inline-block;font-size:15px;padding:4px 12px;border:1px solid var(--ink);border-radius:4px;background:#FDFCF8;letter-spacing:0.06em;}

  .paket-card{border:1px solid var(--border-soft);border-radius:5px;padding:14px 16px;margin-bottom:10px;background:#FDFCF8;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  table.results{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px;}
  table.results th,table.results td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border-soft);}
  table.results th{color:var(--ink-soft);font-weight:600;font-size:12px;}

  .banner{background:var(--olive-soft);color:var(--olive);border-radius:4px;padding:12px 16px;font-size:13.5px;margin-bottom:16px;}
  .banner.warn{background:#F6E4DE;color:var(--red);}

  .score-hero{max-width:380px;margin:50px auto;text-align:center;}
  .score-hero .num{font-size:56px;font-weight:700;font-family:'Lora',serif;color:var(--ink);}
  .score-hero .label{color:var(--ink-soft);font-size:13.5px;}

  @media print{
    body *{visibility:hidden;}
    .sheet, .sheet *{visibility:visible;}
    .sheet{position:absolute;top:0;left:0;box-shadow:none;border:none;width:100%;max-width:100%;padding:0 20px;}
  }
  @media (max-width:640px){
    .app{padding:18px 14px 60px;}
    .row{flex-direction:column;gap:0;}
    .sheet{padding:26px 20px;}
  }
</style>
</head>

// ---------- persistence (Firebase Firestore) ----------
async function loadBank(){
  try{
    const snap = await getDoc(doc(db, 'questionBank', 'main'));
    const qs = snap.exists() ? (snap.data().questions || []) : [];
    setState({ questions: qs, loaded: true });
  }catch(e){ console.error(e); setState({ questions: [], loaded: true }); }
}
async function saveBank(qs){
  try{ await setDoc(doc(db, 'questionBank', 'main'), { questions: qs }); }catch(e){ console.error(e); alert('Gagal menyimpan ke database: ' + (e.code || e.message || e)); }
}
async function loadPaketList(){
  try{
    const snap = await getDocs(query(collection(db, 'paket'), orderBy('createdAt', 'desc')));
    const list = snap.docs.map(d => d.data());
    setState({ paketList: list });
  }catch(e){ console.error(e); setState({ paketList: [] }); }
}

// ---------- question form helpers ----------
function blankForm(type){
  const base = { id: uid(), type, text: "", points: 10 };
  if(type === "mc5" || type === "mc_complex"){
    return {...base, options: ["A","B","C","D","E"].map(() => ({id: uid(), text: ""})), correct: type === "mc5" ? "" : []};
  }
  if(type === "tf"){
    return {...base, correct: true};
  }
  if(type === "matching"){
    return {...base, pairs: [ {id: uid(), left:"", right:""}, {id: uid(), left:"", right:""}, {id: uid(), left:"", right:""} ], extraRight: [] };
  }
  return base;
}

function startAdd(type){ setState({ form: blankForm(type), editingId: null }); }
function startEdit(q){ setState({ form: JSON.parse(JSON.stringify(q)), editingId: q.id }); }
function cancelForm(){ setState({ form: null, editingId: null }); }

function validateForm(f){
  if(!f.text.trim()) return "Isi teks soal terlebih dahulu.";
  if(f.type === "mc5"){
    if(f.options.some(o => !o.text.trim())) return "Isi kelima opsi jawaban.";
    if(!f.correct) return "Pilih satu jawaban yang benar.";
  }
  if(f.type === "mc_complex"){
    if(f.options.some(o => !o.text.trim())) return "Isi kelima opsi jawaban.";
    if(f.correct.length < 2) return "Pilih minimal dua jawaban yang benar.";
  }
  if(f.type === "matching"){
    if(f.pairs.some(p => !p.left.trim() || !p.right.trim())) return "Lengkapi semua pasangan menjodohkan.";
  }
  return null;
}

async function submitForm(){
  const f = state.form;
  const err = validateForm(f);
  if(err){ alert(err); return; }
  let qs;
  if(state.editingId){
    qs = state.questions.map(q => q.id === f.id ? f : q);
  } else {
    qs = [...state.questions, f];
  }
  setState({ questions: qs, form: null, editingId: null });
  await saveBank(qs);
}

async function deleteQuestion(id){
  if(!confirm("Hapus soal ini dari bank soal?")) return;
  const qs = state.questions.filter(q => q.id !== id);
  const sel = new Set(state.selectedIds); sel.delete(id);
  setState({ questions: qs, selectedIds: sel });
  await saveBank(qs);
}

async function bulkDeleteQuestions(){
  const count = state.selectedIds.size;
  if(count === 0) return;
  if(!confirm(`Hapus ${count} soal terpilih dari bank soal? Tindakan ini tidak bisa dibatalkan.`)) return;
  const qs = state.questions.filter(q => !state.selectedIds.has(q.id));
  setState({ questions: qs, selectedIds: new Set() });
  await saveBank(qs);
}

function toggleSelect(id){
  const sel = new Set(state.selectedIds);
  sel.has(id) ? sel.delete(id) : sel.add(id);
  setState({ selectedIds: sel });
}

// ---------- batch import (Excel / CSV) ----------
const TYPE_ALIASES = {
  pg: "mc5", mc5: "mc5", pilihan_ganda: "mc5",
  pg_kompleks: "mc_complex", pilihan_ganda_kompleks: "mc_complex", mc_complex: "mc_complex", mccomplex: "mc_complex",
  benar_salah: "tf", bs: "tf", tf: "tf",
  menjodohkan: "matching", matching: "matching"
};

function normalizeHeader(h){
  return String(h ?? "").toLowerCase().trim().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "");
}
function resolveType(raw){ return TYPE_ALIASES[normalizeHeader(raw)] || null; }
function letterToIndex(letter){ return String(letter || "").trim().toUpperCase().charCodeAt(0) - 65; }

function downloadImportTemplate(){
  // Decode the pre-built xlsx (created with real Excel data-validation dropdowns)
  // and trigger a download, rather than generating it on the fly.
  const binary = atob(TEMPLATE_XLSX_BASE64);
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "template-bank-soal.xlsx";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseImportRow(rowObjRaw){
  const row = {};
  Object.keys(rowObjRaw).forEach(k => { row[normalizeHeader(k)] = rowObjRaw[k]; });

  const rawText = (row.teks_soal ?? row.teks ?? row.soal ?? "").toString().trim();
  const rawType = (row.tipe ?? row.type ?? "").toString().trim();
  const preview = rawText.slice(0, 80) || (rawType ? `(tipe: ${rawType})` : "");

  if(!rawType && !rawText) return { skip: true };

  const type = resolveType(rawType);
  if(!type) return { ok:false, preview, error: `Tipe soal "${rawType}" tidak dikenali. Gunakan: pg, pg_kompleks, benar_salah, atau menjodohkan.` };
  if(!rawText) return { ok:false, preview, error: "Teks soal kosong." };

  let points = Number(row.poin ?? row.points);
  if(!Number.isFinite(points) || points <= 0) points = 10;

  const q = { id: uid(), type, text: rawText, points };

  if(type === "mc5" || type === "mc_complex"){
    const letters = ["a","b","c","d","e"];
    const optTexts = letters.map(l => (row["opsi_" + l] ?? "").toString().trim());
    if(optTexts.some(t => !t)) return { ok:false, preview, error: "Kelima opsi (opsi_a–opsi_e) harus diisi." };
    const options = optTexts.map(t => ({ id: uid(), text: t }));
    q.options = options;

    const kunci = (row.kunci_jawaban ?? row.kunci ?? row.jawaban ?? "").toString().trim();
    if(!kunci) return { ok:false, preview, error: "Kolom kunci_jawaban kosong." };

    if(type === "mc5"){
      if(!/^[A-Ea-e]$/.test(kunci)) return { ok:false, preview, error: `Kunci jawaban "${kunci}" tidak valid, gunakan satu huruf A–E.` };
      q.correct = options[letterToIndex(kunci)].id;
    } else {
      const letterList = kunci.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
      if(letterList.some(s => !/^[A-Ea-e]$/.test(s))) return { ok:false, preview, error: `Kunci jawaban "${kunci}" tidak valid, gunakan huruf A–E dipisah koma (contoh: A,C).` };
      if(letterList.length < 2) return { ok:false, preview, error: "Pilih minimal dua jawaban benar untuk PG Kompleks (contoh: A,C)." };
      q.correct = letterList.map(l => options[letterToIndex(l)].id);
    }
  } else if(type === "tf"){
    const val = normalizeHeader(row.kunci_jawaban ?? row.kunci ?? row.jawaban ?? "");
    if(["benar","true","b","betul"].includes(val)) q.correct = true;
    else if(["salah","false","s"].includes(val)) q.correct = false;
    else return { ok:false, preview, error: `Kunci jawaban "${row.kunci_jawaban ?? ""}" tidak valid, gunakan BENAR atau SALAH.` };
  } else if(type === "matching"){
    const raw = (row.pasangan ?? "").toString().trim();
    if(!raw) return { ok:false, preview, error: "Kolom pasangan kosong." };
    const pairs = raw.split(";").map(s => s.trim()).filter(Boolean).map(s => {
      const parts = s.split("=");
      return { id: uid(), left: (parts[0] || "").trim(), right: (parts.slice(1).join("=") || "").trim() };
    });
    if(pairs.length < 2 || pairs.some(p => !p.left || !p.right)){
      return { ok:false, preview, error: 'Format pasangan tidak valid. Gunakan "kiri = kanan" dipisah titik koma (;), minimal 2 pasangan.' };
    }
    q.pairs = pairs;
  }

  return { ok:true, question: q };
}

async function handleImportFile(file){
  setState({ importError: "", importFileName: file.name });
  try{
    const ext = file.name.split(".").pop().toLowerCase();
    let workbook;
    if(ext === "csv"){
      const text = await file.text();
      workbook = XLSX.read(text, { type: "string" });
    } else {
      const buf = await file.arrayBuffer();
      workbook = XLSX.read(buf, { type: "array" });
    }
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
    if(json.length === 0){ setState({ importError: "Tidak ada data ditemukan di file ini." }); return; }
    const parsed = json.map(r => parseImportRow(r)).filter(r => !r.skip);
    if(parsed.length === 0){ setState({ importError: "Tidak ada baris soal yang bisa dibaca dari file ini." }); return; }
    setState({ importRows: parsed });
  }catch(e){
    console.error(e);
    setState({ importError: "Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv sesuai template." });
  }
}

async function confirmImport(){
  const valid = (state.importRows || []).filter(r => r.ok).map(r => r.question);
  if(valid.length === 0) return;
  const qs = [...state.questions, ...valid];
  setState({ questions: qs, importOpen: false, importRows: null, importFileName: "" });
  await saveBank(qs);
}

// ---------- scoring ----------
function scoreQuestion(q, ans){
  if(ans === undefined || ans === null) return 0;
  if(q.type === "mc5"){
    return ans === q.correct ? q.points : 0;
  }
  if(q.type === "mc_complex"){
    const a = new Set(ans || []);
    const c = new Set(q.correct);
    if(a.size !== c.size) return 0;
    for(const x of a) if(!c.has(x)) return 0;
    return q.points;
  }
  if(q.type === "tf"){
    return ans === q.correct ? q.points : 0;
  }
  if(q.type === "matching"){
    let correctCount = 0;
    q.pairs.forEach(p => { if(ans && ans[p.id] === p.right) correctCount++; });
    return Math.round((correctCount / q.pairs.length) * q.points * 100) / 100;
  }
  return 0;
}

function renderBankTab(){

  if(state.importOpen) return renderImportView();

  const filtered = state.questions.filter(q => {
    if(state.filterType !== 'all' && q.type !== state.filterType) return false;
    if(state.search && !q.text.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });
  const selectedCount = state.selectedIds.size;
  const allFilteredSelected = filtered.length > 0 && filtered.every(q => state.selectedIds.has(q.id));

  return `
    <div class="toolbar">
      <div class="filters">
        ${['all','mc5','mc_complex','tf','matching'].map(t => `<button class="chip ${state.filterType===t?'active':''}" data-filter="${t}">${t==='all'?'Semua':TYPE_LABEL[t]}</button>`).join('')}
      </div>
      <input type="text" placeholder="Cari teks soal…" style="width:200px;padding:7px 10px;border:1px solid var(--border);border-radius:4px;" id="searchbox" value="${escapeHtml(state.search)}"/>

      <button class="btn" data-add="mc5">+ Pilihan Ganda</button>
      <button class="btn secondary" data-add="mc_complex">+ PG Kompleks</button>
      <button class="btn secondary" data-add="tf">+ Benar/Salah</button>
      <button class="btn secondary" data-add="matching">+ Menjodohkan</button>
      <button class="btn secondary" data-open-import>⇪ Impor dari Excel/CSV</button>
    </div>
    ${filtered.length === 0 ? `<div class="empty"><div class="serif">Belum ada soal</div>Tambahkan soal pertama dengan tombol di atas.</div>` : `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid var(--border-soft);border-radius:5px;background:#F4F2EA;">

function renderQuestionCard(q){
  let body = '';
  if(q.type === 'mc5' || q.type === 'mc_complex'){
    const correctSet = q.type === 'mc5' ? new Set([q.correct]) : new Set(q.correct);
    body = `<ul class="opts">${q.options.map((o,i) => `<li class="${correctSet.has(o.id)?'correct':''}" style="border-left-color:${optColor(i)};">${String.fromCharCode(65+i)}. ${escapeHtml(o.text)}</li>`).join('')}</ul>`;
  } else if(q.type === 'tf'){
    body = `<div class="qmeta">Jawaban: <strong style="color:var(--olive)">${q.correct ? 'Benar' : 'Salah'}</strong></div>`;
  } else if(q.type === 'matching'){
    body = `<ul class="opts">${q.pairs.map(p => `<li>${escapeHtml(p.left)} → <span style="color:var(--olive);font-weight:600;">${escapeHtml(p.right)}</span></li>`).join('')}</ul>`;
  }
  return `
    <div class="qcard">
      <div class="qtop">
        <label class="checkline" style="flex-shrink:0;margin-top:2px;"><input type="checkbox" data-select="${q.id}" ${state.selectedIds.has(q.id)?'checked':''}/></label>
        <div style="flex:1;">
          <span class="qtype">${TYPE_LABEL[q.type]}</span>
          <div class="qtext">${escapeHtml(q.text)}</div>
          ${body}
        </div>
        <div class="qactions">
          <button data-edit="${q.id}">Ubah</button>
          <button data-del="${q.id}">Hapus</button>
        </div>
      </div>
      <div class="qmeta">${q.points} poin</div>
    </div>`;
}

        ${f.type === 'mc5'
          ? `<input type="radio" name="correct" data-correct-radio="${o.id}" ${f.correct===o.id?'checked':''}/>`
          : `<input type="checkbox" data-correct-check="${o.id}" ${f.correct.includes(o.id)?'checked':''}/>`}

    fields = `

        <div style="display:flex;gap:16px;">
          <label class="checkline"><input type="radio" name="tfcorrect" data-tf="true" ${f.correct===true?'checked':''}/> Benar</label>

function attachBankHandlers(){
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => setState({ filterType: b.dataset.filter }));
  const sb = document.getElementById('searchbox');
  if(sb) sb.oninput = (e) => setState({ search: e.target.value });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => startAdd(b.dataset.add));
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => startEdit(state.questions.find(q => q.id === b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteQuestion(b.dataset.del));

  document.querySelectorAll('[data-select]').forEach(cb => cb.onchange = () => toggleSelect(cb.dataset.select));
  const selectAll = document.getElementById('bank-select-all');
  if(selectAll) selectAll.onchange = () => {
    const filtered = state.questions.filter(q => {
      if(state.filterType !== 'all' && q.type !== state.filterType) return false;
      if(state.search && !q.text.toLowerCase().includes(state.search.toLowerCase())) return false;
      return true;
    });
    const sel = new Set(state.selectedIds);
    if(selectAll.checked){ filtered.forEach(q => sel.add(q.id)); }
    else { filtered.forEach(q => sel.delete(q.id)); }
    setState({ selectedIds: sel });
  };
  const bulkDel = document.querySelector('[data-bulk-delete]');
  if(bulkDel) bulkDel.onclick = bulkDeleteQuestions;

  const openImport = document.querySelector('[data-open-import]');
  if(openImport) openImport.onclick = () => setState({ importOpen: true, importRows: null, importError: "", importFileName: "" });

  if(state.importOpen){
    const dlTemplate = document.querySelector('[data-download-template]');
    if(dlTemplate) dlTemplate.onclick = downloadImportTemplate;

    const fileInp = document.getElementById('import-file');
    if(fileInp) fileInp.onchange = (e) => { const file = e.target.files[0]; if(file) handleImportFile(file); };

    const cancelImp = document.querySelector('[data-cancel-import]');
    if(cancelImp) cancelImp.onclick = () => setState({ importOpen: false, importRows: null, importError: "", importFileName: "" });

    const confirmImp = document.querySelector('[data-confirm-import]');
    if(confirmImp) confirmImp.onclick = confirmImport;
  }

  if(state.form){
    const f = state.form;
    const qtext = document.getElementById('qtext');
    if(qtext) qtext.oninput = (e) => { f.text = e.target.value; };
    const qpoints = document.getElementById('qpoints');
    if(qpoints) qpoints.oninput = (e) => { f.points = Number(e.target.value) || 0; };

    document.querySelectorAll('[data-opt]').forEach(inp => inp.oninput = (e) => {
      const opt = f.options.find(o => o.id === inp.dataset.opt); opt.text = e.target.value;
    });
    document.querySelectorAll('[data-correct-radio]').forEach(r => r.onchange = () => { f.correct = r.dataset.correctRadio; });
    document.querySelectorAll('[data-correct-check]').forEach(c => c.onchange = () => {
      const id = c.dataset.correctCheck;
      if(c.checked){ if(!f.correct.includes(id)) f.correct.push(id); }
      else { f.correct = f.correct.filter(x => x !== id); }
    });
    document.querySelectorAll('[data-tf]').forEach(r => r.onchange = () => { f.correct = r.dataset.tf === 'true'; });

    document.querySelectorAll('[data-pair-left]').forEach(inp => inp.oninput = (e) => {
      f.pairs.find(p => p.id === inp.dataset.pairLeft).left = e.target.value;
    });
    document.querySelectorAll('[data-pair-right]').forEach(inp => inp.oninput = (e) => {
      f.pairs.find(p => p.id === inp.dataset.pairRight).right = e.target.value;
    });
    document.querySelectorAll('[data-remove-pair]').forEach(b => b.onclick = () => {
      f.pairs = f.pairs.filter(p => p.id !== b.dataset.removePair); render();
    });
    const addPair = document.querySelector('[data-add-pair]');
    if(addPair) addPair.onclick = () => { f.pairs.push({id: uid(), left:"", right:""}); render(); };

    const save = document.querySelector('[data-save-question]');
    if(save) save.onclick = submitForm;
    const cancel = document.querySelector('[data-cancel-form]');
    if(cancel) cancel.onclick = cancelForm;
  }
}

function renderSheetPreview(selected){
  const m = state.sheetMeta;
  let n = 0;
  const body = selected.map(q => {
    n++;
    let opts = '';
    if(q.type === 'mc5' || q.type === 'mc_complex'){
      opts = `<div class="opts">${q.options.map((o,i) => `<div>${String.fromCharCode(65+i)}. ${escapeHtml(o.text)}</div>`).join('')}</div>`;
    } else if(q.type === 'tf'){
      opts = `<div class="opts"><div>B — S</div></div>`;
    } else if(q.type === 'matching'){
      const shuffledRight = shuffle(q.pairs.map(p => p.right));
      opts = `<div class="opts">${q.pairs.map((p,i) => `<div>${i+1}. ${escapeHtml(p.left)}</div>`).join('')}
        <div style="margin-top:6px;">${shuffledRight.map(r => `<div>• ${escapeHtml(r)}</div>`).join('')}</div></div>`;
    }
    return `<div class="sheet-q"><span class="qn">${n}.</span> ${escapeHtml(q.text)} <span style="color:var(--ink-soft);">(${q.points} poin)</span>${opts}</div>`;
  }).join('');

  let key = '';
  if(m.showKey){
    key = `<div class="answer-key"><h3 class="serif">Kunci Jawaban</h3>${selected.map((q,i) => {
      let ans = '';
      if(q.type==='mc5'){ const idx = q.options.findIndex(o=>o.id===q.correct); ans = String.fromCharCode(65+idx); }
      else if(q.type==='mc_complex'){ ans = q.correct.map(cid => String.fromCharCode(65+q.options.findIndex(o=>o.id===cid))).join(', '); }
      else if(q.type==='tf'){ ans = q.correct ? 'Benar' : 'Salah'; }
      else if(q.type==='matching'){ ans = q.pairs.map(p => `${escapeHtml(p.left)} → ${escapeHtml(p.right)}`).join('; '); }
      return `<div class="akrow">${i+1}. ${ans}</div>`;
    }).join('')}</div>`;
  }

  return `
    <div style="margin-top:24px;">
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button class="btn" data-do-print>Cetak / Simpan PDF</button>
        <button class="btn secondary" data-close-preview>Tutup pratinjau</button>
      </div>
      <div class="sheet" id="print-sheet">
        <div class="sheet-head">
          <h2 class="serif">${escapeHtml(m.judul || 'Lembar Soal')}</h2>
          <div class="meta">${escapeHtml(m.mapel)} ${m.mapel&&m.kelas?'—':''} ${escapeHtml(m.kelas)} ${m.waktu ? '· Waktu: '+escapeHtml(m.waktu) : ''}</div>
        </div>
        ${m.petunjuk ? `<div class="instructions">${escapeHtml(m.petunjuk)}</div>` : ''}
        ${body}
        ${key}
      </div>
    </div>
  `;
}

    fetchResults(b.dataset.viewResults);
  });

  if(back) back.onclick = () => setState({ viewingResultsFor: null });
  const refresh = document.querySelector('[data-refresh-results]');
  if(refresh) refresh.onclick = () => fetchResults(state.viewingResultsFor);
}

async function fetchResults(code){
  try{
    const snap = await getDocs(query(collection(db, 'hasil'), where('code', '==', code)));
    const results = snap.docs.map(d => d.data());
    results.sort((a,b) => b.waktu - a.waktu);
    setState({ resultsCache: {...state.resultsCache, [code]: results} });
  }catch(e){
    console.error(e);
    setState({ resultsCache: {...state.resultsCache, [code]: []} });
  }
}

function renderStudentQuestion(q,i){
  const ans = state.answers[q.id];
  let body = '';
  if(q.type === 'mc5'){
    body = q.options.map((o,oi) => `
      <label class="choice ${ans===o.id?'picked':''}" style="background:${optTint(oi)};border-color:${ans===o.id?optColor(oi):'transparent'};">
        <input type="radio" name="q${q.id}" data-mc="${q.id}|${o.id}" ${ans===o.id?'checked':''}/>
        <span class="opt-badge" style="background:${optColor(oi)};">${String.fromCharCode(65+oi)}</span>
        <span>${escapeHtml(o.text)}</span>
        ${ans===o.id ? `<span class="opt-check" style="color:${optColor(oi)};">✓</span>` : ''}
      </label>`).join('');
  } else if(q.type === 'mc_complex'){
    const cur = ans || [];
    body = q.options.map((o,oi) => `
      <label class="choice ${cur.includes(o.id)?'picked':''}" style="background:${optTint(oi)};border-color:${cur.includes(o.id)?optColor(oi):'transparent'};">
        <input type="checkbox" data-mcx="${q.id}|${o.id}" ${cur.includes(o.id)?'checked':''}/>
        <span class="opt-badge" style="background:${optColor(oi)};">${String.fromCharCode(65+oi)}</span>
        <span>${escapeHtml(o.text)}</span>
        ${cur.includes(o.id) ? `<span class="opt-check" style="color:${optColor(oi)};">✓</span>` : ''}
      </label>`).join('');
  } else if(q.type === 'tf'){
    body = `
      <label class="choice ${ans===true?'picked':''}" style="background:${optTint(0)};border-color:${ans===true?optColor(0):'transparent'};">
        <input type="radio" name="q${q.id}" data-tfans="${q.id}|true" ${ans===true?'checked':''}/>
        <span class="opt-badge" style="background:${optColor(0)};">B</span>
        <span>Benar</span>
        ${ans===true ? `<span class="opt-check" style="color:${optColor(0)};">✓</span>` : ''}
      </label>
      <label class="choice ${ans===false?'picked':''}" style="background:${optTint(1)};border-color:${ans===false?optColor(1):'transparent'};">
        <input type="radio" name="q${q.id}" data-tfans="${q.id}|false" ${ans===false?'checked':''}/>
        <span class="opt-badge" style="background:${optColor(1)};">S</span>
        <span>Salah</span>
        ${ans===false ? `<span class="opt-check" style="color:${optColor(1)};">✓</span>` : ''}
      </label>`;
  } else if(q.type === 'matching'){
    const rightOptions = q._shuffledRight || (q._shuffledRight = shuffle(q.pairs.map(p => p.right)));
    const curAns = ans || {};
    const rightColorByVal = {};
    Object.entries(curAns).forEach(([pairId, val]) => {
      const idx = q.pairs.findIndex(p => p.id === pairId);
      if(idx !== -1) rightColorByVal[val] = optColor(idx);
    });
    const leftItems = q.pairs.map((p, pi) => {
      const connected = !!curAns[p.id];
      const c = optColor(pi);
      return `
        <div class="match-item ${connected?'connected':''}" style="background:${optTint(pi)};border-color:${connected?c:'transparent'};">
          <span class="opt-badge" style="background:${c};">${pi+1}</span>
          <span class="match-text">${escapeHtml(p.left)}</span>
          ${connected ? `<button class="match-clear" data-clear-match="${q.id}|${p.id}" title="Hapus pasangan">✕</button>` : ''}
          <span class="dot dot-right" data-anchor="${q.id}|L|${p.id}" style="background:${c};border-color:${c};"></span>
        </div>`;
    }).join('');
    const rightItems = rightOptions.map((r, ri) => {
      const c = rightColorByVal[r];
      const neutralBg = "#8A8574" + "14";
      return `
        <div class="match-item ${c?'connected':''}" style="background:${c?optTint(OPT_COLORS.indexOf(c)):neutralBg};border-color:${c?c:'transparent'};">
          <span class="dot dot-left" data-anchor="${q.id}|R|${ri}" style="${c?`background:${c};border-color:${c};`:''}"></span>
          <span class="match-text">${escapeHtml(r)}</span>
        </div>`;
    }).join('');
    body = `
      <div class="qmeta match-hint">Tarik garis dari titik di sebelah pernyataan kiri ke jawaban yang sesuai di kanan.</div>
      <div class="match-wrap" data-matchwrap="${q.id}">
        <svg class="match-svg"></svg>
        <div class="match-cols">
          <div class="match-col left">${leftItems}</div>
          <div class="match-col right">${rightItems}</div>
        </div>
      </div>`;
  }
  return `
    <div class="quiz-q">
      <div class="qn">Soal ${i+1} · ${q.points} poin</div>
      <div class="qtext">${escapeHtml(q.text)}</div>
      ${body}
    </div>`;
}

// ---------- drag-line matching ----------
function drawMatchLines(qid){
  const wrap = document.querySelector(`[data-matchwrap="${qid}"]`);
  if(!wrap) return;
  const svg = wrap.querySelector('svg.match-svg');
  svg.innerHTML = '';
  const wrapRect = wrap.getBoundingClientRect();
  const q = state.activePaket.questions.find(qq => qq.id === qid);
  if(!q) return;
  const ans = state.answers[qid] || {};
  const rightOptions = q._shuffledRight || [];
  Object.keys(ans).forEach(pairId => {
    const rightText = ans[pairId];
    const ri = rightOptions.indexOf(rightText);
    if(ri === -1) return;
    const pairIdx = q.pairs.findIndex(p => p.id === pairId);
    const leftDot = wrap.querySelector(`[data-anchor="${qid}|L|${pairId}"]`);
    const rightDot = wrap.querySelector(`[data-anchor="${qid}|R|${ri}"]`);
    if(!leftDot || !rightDot) return;
    const l = leftDot.getBoundingClientRect(), r = rightDot.getBoundingClientRect();
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', l.left + l.width/2 - wrapRect.left);
    line.setAttribute('y1', l.top + l.height/2 - wrapRect.top);
    line.setAttribute('x2', r.left + r.width/2 - wrapRect.left);
    line.setAttribute('y2', r.top + r.height/2 - wrapRect.top);
    line.setAttribute('class', 'match-line');
    line.setAttribute('stroke', optColor(pairIdx));
    svg.appendChild(line);
  });
}

let matchDrag = null; // { qid, pairId, svg, wrapRect, temp }

function bindGlobalMatchDragListeners(){
  document.addEventListener('pointermove', (e) => {
    if(!matchDrag) return;
    matchDrag.temp.setAttribute('x2', e.clientX - matchDrag.wrapRect.left);
    matchDrag.temp.setAttribute('y2', e.clientY - matchDrag.wrapRect.top);
  });
  document.addEventListener('pointerup', (e) => {
    if(!matchDrag) return;
    const { qid, pairId, svg, temp } = matchDrag;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const rightDot = el ? el.closest('.dot-left') : null;
    if(svg.contains(temp)) svg.removeChild(temp);
    matchDrag = null;
    if(rightDot){
      const [rqid, , ri] = rightDot.dataset.anchor.split('|');
      if(rqid === qid){
        const q = state.activePaket.questions.find(qq => qq.id === qid);
        const rightOptions = q._shuffledRight || [];
        const rightText = rightOptions[Number(ri)];
        state.answers[qid] = {...(state.answers[qid]||{}), [pairId]: rightText};
        render();
      }
    }
  });
}

function attachMatchDragHandlers(){
  document.querySelectorAll('.match-wrap').forEach(wrap => drawMatchLines(wrap.dataset.matchwrap));

  document.querySelectorAll('.dot-right').forEach(dot => {
    dot.onpointerdown = (e) => {
      e.preventDefault();
      const [qid, , pairId] = dot.dataset.anchor.split('|');
      const wrap = dot.closest('.match-wrap');
      const svg = wrap.querySelector('svg.match-svg');
      const wrapRect = wrap.getBoundingClientRect();
      const start = dot.getBoundingClientRect();
      const x1 = start.left + start.width/2 - wrapRect.left;
      const y1 = start.top + start.height/2 - wrapRect.top;
      const q = state.activePaket.questions.find(qq => qq.id === qid);
      const pairIdx = q ? q.pairs.findIndex(p => p.id === pairId) : 0;
      const temp = document.createElementNS('http://www.w3.org/2000/svg','line');
      temp.setAttribute('x1', x1); temp.setAttribute('y1', y1);
      temp.setAttribute('x2', x1); temp.setAttribute('y2', y1);
      temp.setAttribute('class', 'match-line temp');
      temp.setAttribute('stroke', optColor(pairIdx));
      svg.appendChild(temp);
      matchDrag = { qid, pairId, svg, wrapRect, temp };
    };
  });
}

function attachStudentHandlers(){
  const exit = document.querySelector('[data-exit]');
  if(exit) exit.onclick = () => setState({ role: null, activePaket: null, submitted: false, examCode:"", studentName:"", answers:{} });

  const codeInp = document.getElementById('s-code');
  if(codeInp) codeInp.oninput = e => state.examCode = e.target.value.toUpperCase();
  const nameInp = document.getElementById('s-name');
  if(nameInp) nameInp.oninput = e => state.studentName = e.target.value;

  const join = document.querySelector('[data-join-exam]');
  if(join) join.onclick = async () => {
    if(!state.examCode.trim() || !state.studentName.trim()){
      setState({ examError: "Isi kode ujian dan nama terlebih dahulu." }); return;
    }
    setState({ loadingExam: true, examError: "" });
    try{
      const snap = await getDoc(doc(db, 'paket', state.examCode.trim().toUpperCase()));
      if(!snap.exists()){ setState({ loadingExam: false, examError: "Kode ujian tidak ditemukan." }); return; }
      const paket = snap.data();
      if(paket.shuffle) paket.questions = shuffle(paket.questions);
      setState({ loadingExam: false, activePaket: paket, examCode: paket.code, answers: {} });
    }catch(e){
      setState({ loadingExam: false, examError: "Gagal memuat ujian. Coba lagi." });
    }
  };

  document.querySelectorAll('[data-mc]').forEach(r => r.onchange = () => {
    const [qid, oid] = r.dataset.mc.split('|'); state.answers[qid] = oid; render();
  });
  document.querySelectorAll('[data-mcx]').forEach(c => c.onchange = () => {
    const [qid, oid] = c.dataset.mcx.split('|');
    const cur = state.answers[qid] || [];
    state.answers[qid] = c.checked ? [...cur, oid] : cur.filter(x => x !== oid);
    render();
  });
  document.querySelectorAll('[data-tfans]').forEach(r => r.onchange = () => {
    const [qid, val] = r.dataset.tfans.split('|'); state.answers[qid] = val === 'true'; render();
  });
  document.querySelectorAll('[data-clear-match]').forEach(btn => btn.onclick = () => {
    const [qid, pairId] = btn.dataset.clearMatch.split('|');
    if(state.answers[qid]) delete state.answers[qid][pairId];
    render();
  });
  attachMatchDragHandlers();

  const submit = document.querySelector('[data-submit-exam]');
  if(submit) submit.onclick = async () => {
    setState({ saving: true });
    const paket = state.activePaket;
    let skor = 0, total = 0;
    paket.questions.forEach(q => { total += q.points; skor += scoreQuestion(q, state.answers[q.id]); });
    skor = Math.round(skor*100)/100;
    const record = { code: paket.code, nama: state.studentName, skor, total, waktu: Date.now() };
    try{
      await addDoc(collection(db, 'hasil'), record);
    }catch(e){ console.error(e); /* still show local score even if save fails */ }
    setState({ saving: false, submitted: true, finalScore: { skor, total } });
  };
}

// ---------- boot ----------
bindGlobalMatchDragListeners();
onAuthStateChanged(auth, (user) => {
  setState({ authUser: user, authChecked: true });
});
(async function init(){
  render();
  await loadBank();
  await loadPaketList();
})();
</script>
